# SlideLink Relay on Cloudflare Workers. Deploy once:  npx wrangler login  then  npx wrangler deploy
name = "slidelink-relay"
main = "src/index.js"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "PCS"
class_name = "PcRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PcRelay"]   # SQLite-backed Durable Objects are part of the free Workers plan

# limits per IP address (Workers Rate Limiting): phones, and new PC connections
[[ratelimits]]
name = "IP_LIMIT"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "CLAIM_LIMIT"
namespace_id = "1002"
simple = { limit = 6, period = 60 }
