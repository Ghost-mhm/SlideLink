<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; padding: 16px; background: #14151c; color: #e8eaf2; font: 13px/1.45 system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 24px; height: 24px; }
  label { display: flex; align-items: center; gap: 8px; padding: 10px; background: #242734; border-radius: 9px; cursor: pointer; }
  .muted { color: #9096ab; font-size: 12px; margin-top: 10px; }
  .status { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: #1c1e27; }
  .ok { color: #3ccf8e; } .bad { color: #ff8b8b; }
</style>
</head>
<body>
  <h1><img src="icon48.png" alt="">SlideLink Sync</h1>
  <label><input type="checkbox" id="on"> Sync my claude.ai decks automatically</label>
  <div class="status" id="app">Checking SlideLink…</div>
  <div class="status" id="last">No deck synced yet.</div>
  <p class="muted">Open any of your slide decks on claude.ai and it appears in SlideLink within seconds. Edits you make there are copied over while the deck is open.</p>
  <script src="popup.js"></script>
</body>
</html>
