<!DOCTYPE html>
<!-- SlideLink · EN: Audience page (/live?k=…): the current slide live, the speaker and live polls. Watch only. -->
<!-- SlideLink · DE: Publikumsseite (/live?k=…): die aktuelle Folie live, wer spricht und Live-Umfragen. Nur ansehen. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>SlideLink Live</title>
  <link rel="icon" href="/icon-256.png" sizes="256x256" type="image/png">
  <link rel="icon" href="/icon-128.png" sizes="128x128" type="image/png">
  <link rel="icon" href="/icon-96.png" sizes="96x96" type="image/png">
  <link rel="icon" href="/icon-64.png" sizes="64x64" type="image/png">
  <link rel="icon" href="/icon-48.png" sizes="48x48" type="image/png">
  <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
  <style>
    html, body { background: #000; color: #fff; margin: 0; min-height: 100%; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .lv { max-width: 900px; margin: 0 auto; padding: 10px 12px 28px; }
    .lv-top { display: flex; align-items: center; gap: 8px; padding: 4px 2px 10px; font-size: 14px; }
    .lv-top img { width: 22px; height: 22px; }
    .lv-top b { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lv-live { font-size: 11px; font-weight: 700; color: #ff5d5d; letter-spacing: .06em; }
    .lv-stage { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #111; }
    .lv-stage > div { position: absolute; inset: 0; }
    .lv-black { position: absolute; inset: 0; background: #000; display: none; align-items: center; justify-content: center; color: #555; font-size: 13px; }
    .lv-black.on { display: flex; }
    .lv-meta { display: flex; justify-content: space-between; padding: 8px 2px; font-size: 13px; opacity: .75; }
    .lv-speaker { color: #ffd166; font-weight: 600; opacity: 1; }
    .lv-poll { margin-top: 10px; background: #15161d; border: 1px solid #2a2c3a; border-radius: 14px; padding: 14px; }
    .lv-poll h3 { margin: 0 0 12px; font-size: 17px; }
    .lv-opt { position: relative; display: block; width: 100%; text-align: left; margin: 0 0 8px; padding: 12px 14px; border-radius: 10px;
      border: 1px solid #34364a; background: #1d1f2a; color: #fff; font-size: 15px; cursor: pointer; overflow: hidden; }
    .lv-opt.mine { border-color: #7c83ff; }
    .lv-opt .bar { position: absolute; inset: 0 auto 0 0; background: rgba(124,131,255,.28); transition: width .4s; }
    .lv-opt span { position: relative; }
    .lv-opt .n { float: right; opacity: .8; }
    .lv-note { font-size: 12.5px; opacity: .6; margin-top: 4px; }
    .lv-msg { text-align: center; padding: 60px 20px; opacity: .8; }
    .lv-ask { margin-top: 10px; background: #15161d; border: 1px solid #2a2c3a; border-radius: 14px; padding: 14px; }
    .lv-ask[hidden] { display: none; }
    .lv-ask h3 { margin: 0 0 10px; font-size: 16px; }
    .lv-ask textarea, .lv-ask input { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 10px; border: 1px solid #34364a;
      background: #1d1f2a; color: inherit; font: inherit; font-size: 16px; resize: vertical; }
    .lv-ask-row { display: flex; gap: 8px; margin: 8px 0 6px; }
    .lv-ask-row button { flex: none; padding: 0 18px; border-radius: 10px; border: 0; background: #7c83ff; color: #0e1020; font-weight: 700; font-size: 15px; }
    .lv-ask-row button:disabled { opacity: .5; }
    html[data-theme="light"] .lv-ask { background: #fff; border-color: #d8dbe6; }
    html[data-theme="light"] .lv-ask textarea, html[data-theme="light"] .lv-ask input { background: #f4f5f9; border-color: #d8dbe6; }
    html[data-theme="light"], html[data-theme="light"] body { background: #f4f5f9; color: #1b1d27; }
    html[data-theme="light"] .lv-stage { background: #e4e6ee; }
    html[data-theme="light"] .lv-poll { background: #fff; border-color: #d8dbe6; }
    html[data-theme="light"] .lv-opt { background: #f4f5f9; border-color: #d8dbe6; color: #1b1d27; }
    html[data-theme="light"] .lv-lang { background: #fff; color: #333; border-color: #d8dbe6; }
    html[data-theme="light"] .lv-speaker { color: #b07a00; }
    @media (orientation: landscape) and (max-height: 500px) {   /* phone turned sideways: slide fills the screen */
      .lv { max-width: none; padding: 0; } .lv-top, .lv-meta { display: none; }
      .lv-stage { border-radius: 0; height: 100vh; aspect-ratio: auto; }
    }
  </style>
</head>
<body>
  <div class="lv" id="lv"><div class="lv-msg">Connecting to the presentation…</div></div>
  <script src="/i18n.js"></script>
  <script src="/hslide.js"></script>
  <script src="/live.js"></script>
</body>
</html>
