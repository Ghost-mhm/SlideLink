<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SlideLink logo: a slide on a screen and the phone that controls it, linked by a signal -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a74ff"/>
      <stop offset="0.55" stop-color="#7c6bff"/>
      <stop offset="1" stop-color="#a65cf5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="slide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9ebff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1b1060" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#shine)"/>

  <!-- the slide (screen) -->
  <g filter="url(#shadow)">
    <rect x="72" y="112" width="300" height="196" rx="30" fill="url(#slide)"/>
  </g>
  <rect x="104" y="148" width="132" height="22" rx="11" fill="#6a74ff"/>
  <rect x="104" y="188" width="196" height="14" rx="7" fill="#b9bdf5"/>
  <rect x="104" y="214" width="164" height="14" rx="7" fill="#b9bdf5"/>
  <rect x="104" y="240" width="110" height="14" rx="7" fill="#b9bdf5"/>

  <!-- the link: signal from the phone to the slide -->
  <path d="M 396 128 a 58 58 0 0 1 58 58" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity=".9"/>
  <path d="M 396 86 a 100 100 0 0 1 92 74" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity=".55"/>

  <!-- the phone (remote) -->
  <g filter="url(#shadow)">
    <rect x="300" y="208" width="140" height="232" rx="32" fill="#14151c"/>
  </g>
  <rect x="300" y="208" width="140" height="232" rx="32" fill="none" stroke="#ffffff" stroke-width="10"/>
  <rect x="352" y="226" width="36" height="8" rx="4" fill="#3a3d52"/>
  <!-- "next" button on the phone -->
  <circle cx="370" cy="330" r="42" fill="url(#bg)"/>
  <path d="M 356 306 L 392 330 L 356 354 Z" fill="#ffffff"/>
  <rect x="340" y="396" width="60" height="10" rx="5" fill="#3a3d52"/>
</svg>
